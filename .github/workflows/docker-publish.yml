name: Build, publish and release

# Builds the bundled app image (the Dockerfile's default `runtime` stage) for
# linux/amd64 and linux/arm64 in parallel — each platform on its own native
# runner — then merges them into a single multi-arch manifest on
# ghcr.io/sidhantpanda/mise.
on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/sidhantpanda/mise

permissions:
  contents: read
  packages: write # required to push to GHCR with GITHUB_TOKEN

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.version.outputs.valid }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release.py validate "$TAG" >> "$GITHUB_OUTPUT"

  # Gates every image publish on the full test suite passing for this exact
  # commit — the whole reason test.yml exists. Runs test.yml's jobs as if they
  # were defined right here (a "reusable workflow" call), so `needs: [test]`
  # below actually blocks the build until lint/unit/integration/e2e are green.
  test:
    needs: [version]
    if: github.ref_type != 'tag' || needs.version.outputs.valid == 'true'
    uses: ./.github/workflows/test.yml

  build:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            platform_pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform_pair: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform_pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform_pair }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-arch manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}

  release:
    name: Publish release and changelog
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    needs: [version, merge]
    if: github.ref_type == 'tag' && needs.version.outputs.valid == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - name: Checkout released source and full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: source

      - name: Generate release notes
        working-directory: source
        run: python3 .github/scripts/release.py notes "$TAG" "$GH_REPO" "$RUNNER_TEMP/release-notes.md"

      - name: Checkout default branch for changelog
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: changelog

      # Each attempt applies only our section to the latest branch tip. This
      # handles concurrent releases and regular pushes without force-pushing.
      - name: Commit changelog to default branch
        working-directory: changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$DEFAULT_BRANCH"
            git reset --hard FETCH_HEAD
            python3 ../source/.github/scripts/release.py update CHANGELOG.md "$RUNNER_TEMP/release-notes.md"
            git add CHANGELOG.md
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "docs: update changelog for $TAG"
            if git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "Could not push CHANGELOG.md. Check branch protection and rerun this job."
          exit 1

      - name: Publish GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
