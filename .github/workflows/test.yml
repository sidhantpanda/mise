name: Tests

# Four jobs, cheapest first. `unit` needs no Docker and runs on every push/PR in
# seconds; `integration` and `e2e` boot their own throwaway Postgres +
# Meilisearch via Testcontainers, which works out of the box on `ubuntu-latest`
# (Docker is preinstalled). `workflow_call` lets docker-publish.yml require this
# workflow to pass before it builds an image — see that file's `test` job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  PNPM_VERSION: "11.7.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter common build
      - run: pnpm --filter server exec prisma generate
      - run: pnpm test:unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter common build
      - run: pnpm --filter server exec prisma generate
      - run: pnpm test:integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # The build above is the one under test; :nobuild skips test:e2e's own rebuild.
      - run: pnpm test:e2e:nobuild
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter common build
      - run: pnpm --filter server exec prisma generate
      # Coverage thresholds are global, computed across whatever the run actually
      # instruments — running only a subset of projects undercounts every file the
      # other projects exercise and fails the threshold spuriously, so this has to
      # be the same single `vitest run --coverage` a contributor runs locally
      # (`pnpm test:coverage`), not split like `unit`/`integration` above.
      - run: pnpm test:coverage
