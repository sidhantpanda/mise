# Development Postgres (+ Adminer DB UI) for Kitchen Companion Hub.
# Reads credentials from the root .env (same file the server uses via dotenv).
#   docker compose up -d      # start the database + Adminer
#   docker compose down       # stop them (data persists in ./data/postgres)
#
# Postgres data is bind-mounted to ./data/postgres (gitignored). To wipe the
# database, stop the stack and delete that directory: `rm -rf ./data/postgres`.
#
# Adminer (database UI): http://localhost:8080
#   System:   PostgreSQL
#   Server:   postgres        (the service name; pre-filled)
#   Username: ${POSTGRES_USER}      (default: kitchen)
#   Password: ${POSTGRES_PASSWORD}  (default: kitchen)
#   Database: ${POSTGRES_DB}        (default: kitchen)
services:
  postgres:
    image: postgres:16
    container_name: kitchen-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Listen on POSTGRES_PORT so it's the single source of truth for the port.
    # If you change it, update DATABASE_URL in .env to match (host-side dev uses it).
    command: ["-p", "${POSTGRES_PORT:-5432}"]
    ports:
      - "${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: kitchen-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      # Pre-fill the "Server" field on the login screen.
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
