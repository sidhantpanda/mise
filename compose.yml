# Full application stack for Kitchen Companion Hub: the bundled app (API + SSR
# frontend served on one port) plus its Postgres database and the Adminer DB UI.
# All values are read from the root .env (see .env.example).
#
#   docker compose up -d --build   # build the image and start the whole stack
#   docker compose down            # stop it (Postgres data persists in ./data/postgres)
#
# App:      http://localhost:${APP_PORT} (default 3000)
# Adminer:  http://localhost:${ADMINER_PORT} (default 8080; System: PostgreSQL, Server: postgres)
#
# For local development you usually only want the database — use compose.dev.yml
# (or `pnpm dev:db`) and run the apps with `pnpm dev`.
services:
  # One-shot schema sync. The runtime image has no Prisma CLI, so `prisma db
  # push` runs here from the build stage (which has it) before the app starts.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    image: kitchen-companion-hub:build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
    command: ["pnpm", "--filter", "server", "exec", "prisma", "db", "push", "--accept-data-loss"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kitchen-companion-hub:latest
    container_name: kitchen-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # Inside the compose network Postgres is reached by its service name, not
      # localhost — so build the URL from the same POSTGRES_* vars Postgres uses.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: kitchen-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Listen on POSTGRES_PORT so it's the single source of truth for the port:
    # the mapping, the app's DATABASE_URL and the healthcheck all use it.
    command: ["-p", "${POSTGRES_PORT:-5432}"]
    ports:
      - "${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: kitchen-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      # Pre-fill the "Server" field on the login screen.
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
