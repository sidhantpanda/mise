services:
  mise:
    image: ghcr.io/sidhantpanda/mise:latest
    pull_policy: always
    container_name: mise
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Pull everything from the root .env into the container. Anything set under
    # `environment:` below still wins (Compose precedence: environment > env_file),
    # which is how the container-network DATABASE_URL overrides the localhost one.
    env_file: .env
    environment:
      NODE_ENV: production
      # The runtime image ships the Prisma CLI, so the app syncs the schema
      # itself on boot (createDatabaseIfMissing + `prisma db push`).
      AUTO_MIGRATE: "true"
      # Inside the compose network Postgres is reached by its service name, not
      # localhost — so build the URL from the same POSTGRES_* vars Postgres uses.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: mise-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Listen on POSTGRES_PORT so it's the single source of truth for the port:
    # the mapping, the app's DATABASE_URL and the healthcheck all use it.
    command: ["-p", "${POSTGRES_PORT:-5432}"]
    ports:
      - "${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: mise-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      # Pre-fill the "Server" field on the login screen.
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula

volumes:
  # Named volume for Postgres data — managed by Docker (see `docker volume ls`),
  # survives `docker compose down`, removed only with `docker compose down -v`.
  postgres-data:
