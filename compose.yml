services:
  mise:
    image: ghcr.io/sidhantpanda/mise:latest
    pull_policy: always
    container_name: mise
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      AUTO_MIGRATE: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-mise}:${POSTGRES_PASSWORD:-mise}@postgres:5432/${POSTGRES_DB:-mise}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — put it in .env next to this file (generate one with `openssl rand -hex 32`)}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SERVER_URL: ${SERVER_URL:-http://localhost:3000}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-mise-default-meili-master-key}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: mise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mise}
      POSTGRES_DB: ${POSTGRES_DB:-mise}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mise} -d ${POSTGRES_DB:-mise}"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: mise-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-mise-default-meili-master-key}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data

volumes:
  postgres-data:
  meili-data:
