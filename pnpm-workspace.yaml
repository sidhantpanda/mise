packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  cpu-features: true
  esbuild: true
  msw: true
  prisma: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - vite@8.1.1
  - fumadocs-mdx@15.6.1
  - prettier@3.10.1
  - react-resizable-panels@4.22.0
